<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B2A4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1829;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="toothGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="url(#bgGradient)" rx="22"/>

  <!-- Tooth shape - more realistic -->
  <path d="M 30 35 Q 30 28 35 25 L 65 25 Q 70 28 70 35 L 70 55 Q 70 68 65 73 Q 60 78 50 78 Q 40 78 35 73 Q 30 68 30 55 Z"
        fill="url(#toothGradient)"
        stroke="#E2C97E"
        stroke-width="2.5"
        filter="url(#glow)"/>

  <!-- Tooth details - ridges -->
  <line x1="45" y1="25" x2="45" y2="35" stroke="#dce6ff" stroke-width="1" opacity="0.4"/>
  <line x1="50" y1="25" x2="50" y2="35" stroke="#dce6ff" stroke-width="1" opacity="0.4"/>
  <line x1="55" y1="25" x2="55" y2="35" stroke="#dce6ff" stroke-width="1" opacity="0.4"/>

  <!-- Sparkle effect -->
  <circle cx="40" cy="38" r="2" fill="#E2C97E" opacity="0.8"/>
  <circle cx="60" cy="42" r="1.5" fill="#E2C97E" opacity="0.6"/>
  <path d="M 38 48 L 39 50 L 41 49 L 39 51 L 40 53 L 38 51 L 36 53 L 37 51 L 35 49 L 37 50 Z"
        fill="#E2C97E" opacity="0.7"/>
</svg>
